plugins {
    id 'com.android.application'
}

android {
    namespace 'com.binhiscan.app'
    compileSdk 34

    defaultConfig {
        // Palitan ito kung gusto mong i-update ang dati mong na-install na app (gamitin ang parehong package name)
        applicationId "com.binhiscan.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    androidResources {
        noCompress 'bin', 'json'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
}
