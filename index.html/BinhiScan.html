<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BinhiScan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0c1d14;--card:rgba(20,42,30,.92);--ink:#eaf3e3;--mut:#9bb5a0;--line:#24412f;--pri:#86cf98;--pri2:#1b3a29;--acc:#e5b95f;--ok:#7fcf8e;--wn:#e6b04a;--no:#e5694f;--on:#0f2418;--glow:#c6f0a8;--b1:#1f5a38;--b2:#2f4a22;--bo:.45;--hero:linear-gradient(145deg,#2f6a46,#1a3f2b 78%);--hs:rgba(2,14,8,.8);--sh:0 10px 28px -14px #000;--serif:'Fraunces',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1}.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.6}
.bg i:first-child{width:340px;height:340px;background:var(--b1);top:-80px;left:-90px}.bg i:last-child{width:300px;height:300px;background:var(--b2);top:340px;right:-110px}
.bg i{opacity:var(--bo)}
.ic{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{max-width:640px;margin:0 auto;padding:14px 16px 130px}
.hd{display:flex;align-items:center;gap:12px;background:var(--hero);color:#fff;border-radius:26px;padding:16px 16px;margin-bottom:16px;box-shadow:0 18px 36px -18px var(--hs);position:relative;overflow:hidden}
.hd:after{content:"";position:absolute;right:-50px;top:-70px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07)}
.lg{flex:none;width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;font-size:24px}
.hd b{font:700 23px/1.1 var(--serif);display:block}.hd small{opacity:.8;font-size:11px;line-height:1.3;display:block;margin-top:2px}
.ib{margin-left:auto;flex:none;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;cursor:pointer;z-index:1}
.pg{display:none}.pg.on{display:block;animation:up .35s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:var(--sh)}
h2{font:700 21px/1.2 var(--serif);margin:0 0 6px}h2 small{font:500 13px var(--sans);color:var(--mut)}
p{margin:0 0 14px;color:var(--mut)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:15px;font:700 15px var(--sans);cursor:pointer;background:var(--hero);color:#fff;box-shadow:var(--sh);margin-bottom:10px}
.btn.g{background:var(--pri2);color:var(--pri);box-shadow:none;border:1px solid var(--line)}.btn.r{background:rgba(229,105,79,.14);color:var(--no);box-shadow:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two .btn{margin:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.stats .card{margin:0;padding:16px}.stats b{font:700 30px var(--serif);color:var(--pri);display:block}.stats span{color:var(--mut);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:9px 14px;border-radius:99px;font:500 14px var(--sans);cursor:pointer}
label.l{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
select{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
input[type=range]{width:100%;accent-color:var(--pri)}
.note{font-size:13px;color:var(--mut)}
.vf{aspect-ratio:1;width:100%;max-width:340px;margin-left:auto;margin-right:auto;border-radius:28px;background:var(--hero);position:relative;display:grid;place-items:center;margin-bottom:14px;overflow:hidden;cursor:pointer}
.vf>span{font-size:70px;filter:drop-shadow(0 10px 12px rgba(0,0,0,.35))}
.vf b{position:absolute;width:56px;height:56px;border:4px solid #fff;border-radius:0;opacity:.95}
.vf b:nth-child(1){top:24px;left:24px;border-right:0;border-bottom:0;border-top-left-radius:18px}.vf b:nth-child(2){top:24px;right:24px;border-left:0;border-bottom:0;border-top-right-radius:18px}.vf b:nth-child(3){bottom:24px;left:24px;border-right:0;border-top:0;border-bottom-left-radius:18px}.vf b:nth-child(4){bottom:24px;right:24px;border-left:0;border-top:0;border-bottom-right-radius:18px}
.vf u{position:absolute;left:34px;right:34px;height:2px;background:linear-gradient(90deg,transparent,var(--glow),transparent);box-shadow:0 0 14px var(--glow);animation:sc 2.6s ease-in-out infinite}
@keyframes sc{0%,100%{top:36px}50%{top:calc(100% - 38px)}}
.ready{background:var(--pri2);color:var(--pri);border-radius:14px;padding:11px 14px;font-weight:500;font-size:14px;margin-bottom:14px}
.gh{display:flex;gap:14px;align-items:center;margin:4px 0 8px}.gh>span{font-size:40px;width:64px;height:64px;border-radius:20px;background:var(--pri2);display:grid;place-items:center}
.gh h3{font:700 20px var(--serif);margin:0}.gh small{color:var(--mut)}
.gr{padding:12px 0;border-top:1px solid var(--line)}.gr b{display:block;font:700 15px var(--serif)}.gr p{margin:2px 0 0}
.cal{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:8px}.cal i{font-style:normal;text-align:center;font-size:12px;padding:8px 0;border-radius:10px;background:var(--bg);color:var(--mut)}
.cal i.y{background:var(--pri);color:var(--on);font-weight:700}.cal i.n{outline:2px solid var(--acc);outline-offset:1px}
.verdict{display:inline-block;font-weight:700;padding:7px 16px;border-radius:99px;margin-bottom:10px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.ok{--c:var(--ok)}.wn{--c:var(--wn)}.no{--c:var(--no)}
.gauge{text-align:center;position:relative;margin:6px 0}.gauge svg{width:200px;max-width:100%}.gauge b{position:absolute;left:0;right:0;bottom:4px;font:500 42px/1 var(--serif)}
.chk{display:flex;gap:12px;padding:11px 12px;border-radius:16px;margin-bottom:8px;background:color-mix(in srgb,var(--c) 9%,transparent)}
.chk>i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 13px var(--sans);font-style:normal}
.chk b{display:block;font-size:14px}.chk span{font-size:13px;color:var(--mut)}
.hr{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line)}.hr b{font:700 16px var(--serif);display:block}.hr small{color:var(--mut)}.hr .btn{width:auto;padding:10px 16px;margin:0;font-size:14px}
.thumb{width:100%;max-height:150px;object-fit:cover;border-radius:16px;margin-top:10px}
.tab{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);max-width:616px;margin:0 auto;height:70px;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:30px;box-shadow:0 16px 36px -14px rgba(0,0,0,.6);display:grid;grid-template-columns:1fr 1fr 92px 1fr 1fr;z-index:30}
.tab>button{background:none;border:0;color:var(--mut);font:500 11px var(--sans);display:grid;justify-items:center;align-content:center;gap:3px;cursor:pointer;position:relative}
.tab>button.on{color:var(--pri);font-weight:700}.tab>button.on:before{content:"";position:absolute;top:7px;width:28px;height:4px;border-radius:4px;background:var(--pri)}
.mid{position:relative}
.sc{position:absolute;left:50%;top:-30px;transform:translateX(-50%);width:70px;height:70px;border-radius:50%;border:6px solid var(--bg);background:var(--hero);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 14px 26px -6px var(--hs);transition:.2s;padding:0}
.sc .ic{width:28px;height:28px}.sc.on{box-shadow:0 0 0 5px color-mix(in srgb,var(--pri) 25%,transparent),0 14px 26px -6px var(--hs)}
.mid small{position:absolute;bottom:9px;left:0;right:0;text-align:center;font:700 11px var(--sans);color:var(--pri)}
.ov{display:none;position:fixed;inset:0;z-index:50}.ov.on{display:block}
#cam{background:#101512}#cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rb{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#1d2b21;font-size:22px;display:grid;place-items:center;cursor:pointer}
.ctop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;z-index:3}
.frame{position:absolute;left:11%;right:11%;top:18%;aspect-ratio:1;z-index:2}
.frame b{position:absolute;width:64px;height:64px;border:5px solid #fff;border-radius:0;filter:drop-shadow(0 0 6px rgba(0,0,0,.35))}
.frame b:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:22px}.frame b:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:22px}.frame b:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:22px}.frame b:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:22px}
#hint{display:none!important;position:absolute;left:0;right:0;bottom:170px;text-align:center;color:#fff;font-weight:500;text-shadow:0 1px 8px #000;z-index:3;padding:0 24px}
.cbar{position:absolute;left:0;right:0;bottom:0;background:#fff;display:flex;justify-content:space-around;align-items:center;padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 20px);z-index:3}
.cbar .rb{background:#e8f2e6;color:#1d2b21;font-size:19px}
#shut{width:72px;height:72px;border-radius:50%;background:var(--pri);border:5px solid #fff;box-shadow:0 0 0 3px var(--pri);cursor:pointer}
#tipbox{position:absolute;left:18px;right:18px;bottom:150px;background:#fff;color:#1d2b21;border-radius:18px;padding:14px 18px;z-index:4;font-size:14px}
#ana{background:var(--bg);text-align:center;padding-top:env(safe-area-inset-top,0px)}
#ana .rb{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;background:var(--card);box-shadow:var(--sh)}
.circ{width:min(72vw,290px);aspect-ratio:1;border-radius:50%;overflow:hidden;position:relative;border:10px solid var(--line);margin:17vh auto 22px;background:var(--pri2);display:grid;place-items:center}
.circ img{width:100%;height:100%;object-fit:cover;display:block}.circ.sm{width:120px;margin:6px auto 12px;border-width:6px;font-size:54px}
.sweep{position:absolute;left:0;right:0;top:0;height:0;background:color-mix(in srgb,var(--pri) 40%,transparent);border-bottom:3px solid var(--pri);animation:sw 2.2s ease-in-out infinite}
@keyframes sw{0%{height:0}50%{height:100%}100%{height:0}}
#atx{font:700 18px var(--serif);padding:0 24px;margin:0 0 16px;color:var(--ink)}#retry{width:auto;display:inline-flex;padding:13px 26px}
#res{background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 40px}#res .in{max-width:640px;margin:0 auto}
.cf{display:flex;align-items:center;gap:10px;margin:10px 0}.cf .bar{flex:1;height:10px;border-radius:9px;background:var(--line);overflow:hidden}.cf .bar i{display:block;height:100%;background:var(--hero)}
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:#1d2b21;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;transition:.3s;z-index:90;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;color:var(--mut);font-size:12px;margin:18px 0}

.srch{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin-bottom:12px}
.chip.ai{border-color:var(--pri);color:var(--pri);font-weight:700}
[hidden]{display:none!important}
.ready.warn{background:color-mix(in srgb,var(--wn) 16%,transparent);color:var(--wn)}.ready a{color:inherit}
#tr,#dm{width:auto;display:inline-flex;padding:13px 26px;margin:6px}

.ib+.ib{margin-left:0}
.hdw{position:relative}

.cam{aspect-ratio:4/3;border-radius:22px;overflow:hidden;background:#101512;margin-bottom:12px}.cam video{width:100%;height:100%;object-fit:cover}
#cap{touch-action:none;user-select:none;-webkit-user-select:none}
.cnt{padding:8px 13px;border-radius:99px;font-size:13px;background:var(--bg);border:1px solid var(--line)}.cnt.ok{background:var(--pri2);color:var(--pri);font-weight:700}.cnt.lo{border-color:var(--acc)}
#log{white-space:pre-line;font-size:13px;color:var(--mut);margin-top:10px}
.pr{display:flex;align-items:center;gap:10px;margin:8px 0}.pr b{width:92px;font-size:14px}.pr .bar{flex:1;height:12px;border-radius:9px;background:var(--line);overflow:hidden}.pr .bar i{display:block;height:100%;background:var(--hero)}.pr span{width:44px;text-align:right;font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row2 .btn{margin:0}

.chip.on{background:var(--pri);border-color:var(--pri);color:var(--on)}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--pri2);padding:5px;border-radius:16px;border:1px solid var(--line)}
.seg button{border:0;background:none;color:var(--pri);font:700 15px var(--sans);padding:12px;border-radius:12px;cursor:pointer}
.seg button.on{background:var(--hero);color:#fff;box-shadow:var(--sh)}
.sec{font:700 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:4px 4px 10px}
</style></head><body>
<svg style="display:none"><symbol id="i-seed" viewBox="0 0 24 24"><path d="M12 2.5c4.6 2.6 7 6.6 7 10.5a7 7 0 01-14 0c0-3.900 2.400-7.900 7-10.500zM12 8v12M12 12.500c-2-.6-3.200-1.800-3.800-3.500M12 15.500c2-.6 3.200-1.800 3.800-3.500"/></symbol><symbol id="i-set" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 4v6M9 14v6"/></symbol><symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></symbol><symbol id="i-guide" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3V4zM9 8h6M9 12h6"/></symbol><symbol id="i-cam" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 17a4 4 0 100-8 4 4 0 000 8z"/></symbol><symbol id="i-soil" viewBox="0 0 24 24"><path d="M12 20v-8M12 12c0-4-3-6-7-6 0 4 3 6 7 6zM12 14c0-3 2-5 6-5 0 3-2 5-6 5zM6 21h12"/></symbol><symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></symbol><symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol></svg>
<div class="bg"><i></i><i></i></div>
<div class="app">
<div class="hdw"><header class="hd"><div class="lg"><svg class="ic" style="width:30px;height:30px"><use href="#i-seed"/></svg></div><div><b>BinhiScan</b><small data-i="hdsub"></small></div><button class="ib" id="hb" data-label="settings"><svg class="ic"><use href="#i-set"/></svg></button></header></div>

<section class="pg on" id="p-home">
<div class="card"><h2 data-i="welcome"></h2><p data-i="welcomeP"></p>
<button class="btn" data-go="scan"><svg class="ic"><use href="#i-cam"/></svg><span data-i="scanSeed"></span></button><button class="btn g" data-go="guide" style="margin:0" data-i="viewGuides"></button></div>
<div class="stats"><div class="card"><b id="ns">0</b><span data-i="savedScans"></span></div><div class="card"><b id="nc">0</b><span data-i="seedsCat"></span></div></div>
<div class="card"><h2 data-i="commonH"></h2><p data-i="commonP"></p><div class="chips" id="cats" style="margin-bottom:12px"></div><input id="sq" class="srch"><div class="chips" id="seeds"></div></div>
</section>

<section class="pg" id="p-scan">
<div class="card"><h2 data-i="scanH"></h2><p data-i="scanP"></p>
<div class="vf" id="vf"><b></b><b></b><b></b><b></b><u></u><span>🌱</span></div>
<div class="ready" id="ready"></div>
<div class="two"><button class="btn" id="bcam"><svg class="ic"><use href="#i-cam"/></svg><span data-i="scanCam"></span></button><label class="btn g" style="margin:0"><span data-i="uploadPhoto"></span><input type="file" id="up" accept="image/*" hidden></label></div>
</div>
</section>

<section class="pg" id="p-guide"><div class="card"><h2 data-i="guideH"></h2><p data-i="guideP"></p><label class="l" data-i="selectSeed"></label><select id="gs"></select></div><div class="card" id="gout"></div></section>

<section class="pg" id="p-soil">
<div class="card"><h2 data-i="soilH"></h2><p data-i="soilP"></p>
<div class="two"><label class="btn g" style="margin:0"><span data-i="upload"></span><input type="file" id="sp1" accept="image/*" hidden></label><label class="btn g" style="margin:0"><span data-i="takePhoto"></span><input type="file" id="sp2" accept="image/*" capture="environment" hidden></label></div><div id="sthumb"></div></div>
<div class="card"><label class="l" style="margin-top:0" data-i="q1"></label><select id="cs"></select>
<label class="l" data-i="q2"></label><select id="so"><option value="Clay" data-i="clay"></option><option value="Loam" data-i="loam" selected></option><option value="Sandy" data-i="sandy"></option></select>
<label class="l" data-i="q3"></label><select id="mo"><option value="Dry" data-i="dry"></option><option value="Moist" data-i="moist" selected></option><option value="Waterlogged" data-i="wet"></option></select>
<label class="l" data-i="q4"></label><select id="sn"><option value="3" data-i="sun3"></option><option value="5" data-i="sun5"></option><option value="7" data-i="sun7" selected></option></select>
<label class="l" data-i="q5"></label><select id="wx"><option value="Sunny" data-i="wSunny"></option><option value="Cloudy" data-i="wCloudy"></option><option value="Rainy" data-i="wRainy"></option><option value="Cool" data-i="wCool"></option></select>
<button class="btn" id="chk" style="margin-top:20px" data-i="checkSuit"></button></div>
<div class="card" id="sout" hidden></div>
</section>

<section class="pg" id="p-season"><div class="card"><h2 data-i="seasonH"></h2><p data-i="seasonP"></p>
<div class="ready"><small style="display:block;opacity:.8" data-i="today"></small><b style="font:700 22px var(--serif)" id="dt"></b></div>
<label class="l" data-i="chooseSeed"></label><select id="ses"></select><button class="btn" id="sbt" style="margin-top:14px" data-i="checkSeason"></button>
<div id="sout2"></div><p class="note" style="margin:6px 0 0" data-i="seasonNote"></p></div></section>

<section class="pg" id="p-settings">
<div class="card"><h2 data-i="setH"></h2>
<label class="l" style="margin-top:14px" data-i="langL"></label>
<div class="seg" id="lang"><button data-l="en">English</button><button data-l="tl">Tagalog</button></div></div>
<div class="card"><h2 data-i="histH"></h2><p data-i="histP"></p>
<button class="btn g" id="exp" data-i="exportH"></button><button class="btn r" id="clr" data-i="clearH"></button><div id="hl"></div></div>
</section>
</div>

<nav class="tab"><button data-go="home"><svg class="ic"><use href="#i-home"/></svg><span data-i="tHome"></span></button><button data-go="guide"><svg class="ic"><use href="#i-guide"/></svg><span data-i="tGuide"></span></button>
<div class="mid"><button class="sc" data-go="scan" aria-label="Scan Seed"><svg class="ic"><use href="#i-cam"/></svg></button><small data-i="tScan"></small></div>
<button data-go="soil"><svg class="ic"><use href="#i-soil"/></svg><span data-i="tSoil"></span></button><button data-go="season"><svg class="ic"><use href="#i-sun"/></svg><span data-i="tSeason"></span></button></nav>

sv==2?A("ok",t("lSoil"),t("soilIdeal",s.en),25):sv==1?A("wn",t("lSoil"),t("soilOk"),15):A("no",t("lSoil"),t("soilBad"),4);
ph>=s.ph[0]&&ph<=s.ph[1]?A("ok",t("lPh"),t("phIn",ph,s.ph[0],s.ph[1]),20):A("wn",t("lPh"),ph<s.ph[0]?t("phLow",ph,s.ph[0],s.ph[1]):t("phHigh",ph,s.ph[0],s.ph[1]),9);

mo=="Waterlogged"?(s.wet?A("ok",t("lMoist"),t("mWetOk",s.en),15):A("no",t("lMoist"),t("mWetNo"),2)):mo=="Dry"?(s.wet?A("no",t("lMoist"),t("mDryNo",s.en),3):A("wn",t("lMoist"),t("mDryWn"),9)):A("ok",t("lMoist"),t("mOk"),15);
sn>=s.sun?A("ok",t("lSun"),t("sOk",s.en),10):sn>=s.sun-2?A("wn",t("lSun"),t("sLow",s.en,s.sun),6):A("no",t("lSun"),t("sNo",s.en),2);
inS?A("ok",t("lSeason"),t("seOk",M[NOW-1]),10):A("wn",t("lSeason"),t("seNo",M[NOW-1]),3);
const v=p>=75?["ok",t("vOk")]:p>=50?["wn",t("vWn")]:["no",t("vNo")],I={ok:"✓",wn:"!",no:"✕"};
const o=$("#sout");o.hidden=false;o.innerHTML=`<h2>${t("result")} <small>— ${s.en}</small></h2><div class="gauge ${v[0]}"><svg viewBox="0 0 160 90"><path d="M10 80A70 70 0 0 1 150 80" fill="none" stroke="var(--line)" stroke-width="12" stroke-linecap="round"/><path d="M10 80A70 70 0 0 1 150 80" fill="none" stroke="var(--c)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${p/100*220} 220"/></svg><b>${p}</b></div><div style="text-align:center"><span class="verdict ${v[0]}">${v[1]}</span></div>`+r.map(c=>`<div class="chk ${c[0]}"><i>${I[c[0]]}</i><div><b>${c[1]}</b><span>${c[2]}</span></div></div>`).join("")+`<p class="note">${t("estimate")}</p>`;o.scrollIntoView({behavior:"smooth"})};
function renderH(){$("#hl").innerHTML=hist.length?hist.map((h,i)=>{const s=find(h.id);return `<div class="hr"><div><b>${s.e} ${s.tl} (${s.en})</b><small>${h.ts} · ${h.c.toFixed(1)}%</small></div><button class="btn g" data-h="${h.id}">${t("viewGuide")}</button></div>`}).join(""):`<p class="note" style="margin-top:14px">${t("noScans")}</p>`;$$("[data-h]").forEach(b=>b.onclick=()=>go("guide",b.dataset.h))}

/* ===== SARILING AI MODEL (TensorFlow.js) =====
   Galing sa training/train.py. Ilagay ang laman ng training/out/tfjs/ sa folder na model/
   (model.json, mga .bin, labels.json). Walang Claude o API na ginagamit. */
const MIN_CONF=0.6;   // pinakamababang kumpiyansa; itaas kung madalas mali
let net=null,labels=null;
async function getLabels(){try{const r=await fetch("model/labels.json");if(r.ok)return await r.json()}catch(e){}return(await(await fetch("model/metadata.json")).json()).labels}  // labels.json (train.py) o metadata.json (Teachable Machine)
async function loadModel(){if(typeof tf==="undefined")throw{code:"notf"};if(net)return net;
try{labels=await getLabels();net=await tf.loadLayersModel("model/model.json");return net}catch(e){console.error(e);throw{code:"model"}}}   // o galing sa folder na model/
async function identifyModel(f){const m=await loadModel(),img=new Image();img.src=URL.createObjectURL(f);await img.decode();
const p=tf.tidy(()=>m.predict(tf.browser.fromPixels(img).resizeBilinear([224,224]).toFloat().div(127.5).sub(1).expandDims(0)));
const pr=Array.from(await p.data());p.dispose();const i=pr.indexOf(Math.max(...pr)),conf=pr[i],name=labels[i].toLowerCase(),s=D.find(s=>s.id==name);
if(name=="not_seed"||name.includes("hindi"))return{id:null,reason:()=>t("noSeedPhoto")};
if(!s||conf<MIN_CONF)return{id:null,reason:()=>t("notSure",Math.round(conf*100),labels[i])};
return{id:s.id,c:conf*100}}
/* ===== AI MODE ===== "model" = totoong machine learning (galing sa training/train.py) | "demo" = random, pang-check ng UI lang */
let AI_MODE="model",demoOnce=false,lastFile=null;
async function demoScan(){await new Promise(r=>setTimeout(r,2200));const s=D[Math.floor(Math.random()*D.length)];return{id:s.id,c:80+Math.random()*18,demo:true}}
let lastDemo=false;
/* ===== BUILT-IN AI (zero-shot CLIP, walang training) =====
   Gumagana agad kahit wala pang na-train na model. */
const NOT=["a human hand","a table","soil","an empty background"];
let zs=null;
async function loadZS(){if(zs)return zs;let T;try{T=await import("https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2")}catch(e){console.error(e);throw{code:"zs"}}
T.env.allowLocalModels=false;
try{zs=await T.pipeline("zero-shot-image-classification","Xenova/clip-vit-base-patch32",{progress_callback:p=>{if(p&&p.status=="progress"&&p.progress!=null)$("#atx").textContent=t("downloading",Math.round(p.progress))}})}catch(e){console.error(e);throw{code:"zs"}}
$("#atx").textContent=t("analyzing");return zs}
async function identifyZS(f){const m=await loadZS(),labs=D.map(s=>s.en.toLowerCase()+" seeds").concat(NOT);
let out;try{out=await m(URL.createObjectURL(f),labs)}catch(e){console.error(e);throw{code:"zs"}}
const top=out[0],k=labs.indexOf(top.label);
if(k<0||k>=D.length)return{id:null,reason:()=>t("noSeedPhoto")};
if(top.score<0.3)return{id:null,reason:()=>t("notSure",Math.round(top.score*100),D[k].tl)};
return{id:D[k].id,c:top.score*100}}
async function hasTrained(){try{return(await fetch("model/labels.json")).ok}catch(e){return false}}
async function identify(f){if(AI_MODE=="demo"||demoOnce){demoOnce=false;return demoScan()}return(await hasTrained())?identifyModel(f):identifyZS(f)}
async function scan(file){if(!file)return;lastFile=file;$("#dm").hidden=true;const url=URL.createObjectURL(file);$("#aimg").src=url;$("#sw").style.display="";$("#retry").hidden=true;$("#atx").textContent=t("analyzing");ov("ana");
const fail=t=>{$("#sw").style.display="none";$("#atx").innerHTML=t;$("#retry").hidden=false};
try{const r=await identify(file);if(!r||!find(r.id)){fail((r&&r.reason?r.reason():t("noSupported"))+"<br><small style='font:400 13px var(--sans);color:var(--mut)'>"+t("tryCloser")+"</small>");return}
const c=Math.max(0,Math.min(100,+r.c||0));hist.unshift({id:r.id,c,ts:new Date().toLocaleString(t("loc"))});hist=hist.slice(0,30);saveH();lastDemo=!!r.demo;openRes(r.id,c,url)}
catch(e){console.error(e);const m=e.code=="model",nt=e.code=="notf";fail(m?t("errModel"):nt?t("errTf"):e.code=="zs"?t("errZs"):t("errScan"));if(m){$("#dm").hidden=false}}}
function openRes(id,c,img){const s=find(id),R=$("#res");R.innerHTML=`<div class="in"><button class="btn g" id="rbk" style="width:auto;padding:11px 18px;margin-bottom:12px">${t("back")}</button><div class="card" style="text-align:center">${lastDemo?`<span class="verdict wn">${t("demoTag")}</span>`:""}<div class="circ sm"><img src="${img}" alt=""></div><h2 style="font-size:28px">${s.tl}</h2><p style="margin:0">${s.en}</p><div class="cf"><span style="font-weight:700">${Math.round(c)}%</span><div class="bar"><i style="width:${c}%"></i></div><small class="note">${t("confidence")}</small></div></div><div class="card">${guide(s,true)}</div><button class="btn" id="rsoil">${t("soilBtn")}</button><button class="btn g" id="rdone">${t("done")}</button></div>`;
ov("res");R.scrollTop=0;$("#rbk").onclick=()=>ov(null);$("#rdone").onclick=()=>{ov(null);go("home")};$("#rsoil").onclick=()=>{ov(null);go("soil",id)}}
function soilPhoto(f){if(!f)return;$("#sthumb").innerHTML=`<img class="thumb" src="${URL.createObjectURL(f)}" alt=""><p class="note" style="margin:8px 0 0">${t("photoNote")}</p>`}
$("#sp1").onchange=e=>soilPhoto(e.target.files[0]);$("#sp2").onchange=e=>soilPhoto(e.target.files[0]);

async function aiStatus(){const el=$("#ready");let n=0;try{const r=await fetch("model/labels.json");if(r.ok)n=(await r.json()).filter(x=>x!="not_seed").length}catch(e){}
el.className="ready";el.innerHTML=t("ready",n);el.style.display=n?"":"none"}
